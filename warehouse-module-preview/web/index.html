/* Document review (hub) */
function cdDoc(focus=null){const d=CD().doc;temp.cdFocus=focus;
  const rows=d.rows.map(r=>{const [t,c]=cdDecision(r);const U=`&nbsp;<span class="unit">${esc(r.unit)}</span>`;const q=r.fixed?`<span class="mono">${esc(r.fixed)}</span>${U}<div class="sub">Распознано: ${esc(r.machine)}</div>`:`<span class="mono">${esc(r.machine)}</span>${U}${r.machine!==r.printed&&r.state==='check'?'<div class="sub">Сверьте с оригиналом</div>':''}`;
    const dec=r.state==='linked'?`<div class="cd-row-dec">→ <b>${esc(material(r.linked).name)}</b> · ${esc(material(r.linked).uid)}</div>`:r.state==='ocrFixed'?`<div class="cd-row-dec">${esc(r.machine)} → <b>${esc(r.fixed)}</b> · ${esc(r.fixedBy)}</div>`:r.state==='disc'?`<div class="cd-row-dec">${esc(r.disc)} · фактически ${esc(r.actual.desc)}, ${r.actual.qty} ${esc(r.actual.unit)}</div>`:r.state==='ok'?`<div class="cd-row-dec">→ <b>${esc(material(r.mid).name)}</b></div>`:'';
    return [{class:'cdn',html:String(r.n)},{class:'title',html:`<span class="cdn-m">Строка ${r.n}</span><strong class="rowtitle">${esc(r.text)}</strong>${r.article?`<div class="sub">Артикул поставщика ${esc(r.article)}</div>`:''}${dec}`},numbercell(q),badge(t,c),r.state==='ok'?btn('Открыть','cdLine',String(r.n),'small ghost','right'):btn(r.state==='check'?'Разобрать':'Решение','cdLine',String(r.n),'small','right')];});
  const left=d.rows.filter(r=>r.state==='check').length;
  openModal(d.id+' · разбор строк','Счёт '+d.invoice+' · '+supplier(d.supplier).name+' · версия источника '+d.version,
   CD_DEMO+`<div class="row wrap between mb16"><div class="pillrow">${badge(d.accepted?'Проверенные строки приняты':'Факт приёмки не подтверждён',d.accepted?'green':'amber')}${badge(left?left+' '+cdPlural(left,['строка','строки','строк'])+' без решения':'Все строки разобраны',left?'amber':'green')}${badge('Версия источника '+d.version,'outline')}</div></div>`+
   `${table(['№','Товар в документе','Количество','Решение',''],rows,{mcompact:true})}<div class="mt16">${notice('Для каждой спорной строки — одна из трёх разных команд: исправить распознавание, связать с карточкой каталога или зафиксировать, что товар отличается. Счёт не подтверждает приход ни одной строки.','info')}</div><div class="cd-split wide-right mt16"><div class="cd-col doc"><h3>Оригинал документа</h3>${cdSource(focus)}</div><div class="cd-col"><h3>История решений</h3><div class="cd-hist">${cdHistHTML()}</div><h3 class="mt24">Версии источника</h3>${CD().doc.versions.map(v=>`<div class="auditrow"><div class="time">v${v.v}</div><div><strong>${date(v.at)} · ${esc(v.by)}</strong><p class="small muted">${esc(v.note)}</p></div></div>`).join('')}</div></div>`,
   btn('Повторное распознавание','cdRescan','','','refresh')+(cdOpenDiscs().length?btn('Расхождения','cdDisputes','','','alert'):'')+(d.accepted?btn('Закрыть','closeModal'):btn('Принять проверенные строки','cdAccept','','primary','check')),{wide:true});}
/* Row: three explicit, different commands */
function cdLine(n){const r=cdRow(n);if(!r)return;if(r.state==='disc')return cdDisc(r.disc);
  const [t,c]=cdDecision(r);
  const card=(key,ic,title,when,effects,action)=>`<div class="cd-cmd ${r.hint===key&&r.state==='check'?'is-suggested':''}">${icon(ic)}<h3>${title}</h3>${r.hint===key&&r.state==='check'?'<span class="hint">Совпадает с сообщением приёмки</span>':''}<p>${when}</p><ul>${effects.map(e=>`<li>${e}</li>`).join('')}</ul>${btn(title,action,String(r.n),'')}</div>`;
  openModal('Строка '+r.n+' · '+r.text,CD().doc.id+' · выберите, что произошло',
   CD_DEMO+`<div class="cd-split"><div class="cd-col doc"><h3>Как напечатано в оригинале</h3><dl class="cd-kv"><dt>Товар</dt><dd>${esc(r.text)}</dd><dt>Количество</dt><dd>${esc(r.printed)} ${esc(r.unit)}</dd><dt>Цена / сумма</dt><dd>${rub(r.price)} / ${rub(r.amount)}</dd>${r.article?`<dt>Артикул</dt><dd>${esc(r.article)}</dd>`:''}</dl></div><div class="cd-col"><h3>Что прочитала программа</h3><dl class="cd-kv"><dt>Товар</dt><dd>${esc(r.text)}</dd><dt>Количество</dt><dd>${esc(r.machine)} ${esc(r.unit)}</dd><dt>Состояние</dt><dd>${badge(t,c)}</dd></dl></div></div>`+
   `<div class="cd-cmds">${card('ocr','edit','Исправить распознавание','Программа неверно прочитала то, что реально напечатано.',['правка по изображению оригинала','сохраняются машинное и исправленное значения, автор и время','новое поступление не создаётся'],'cdOcr')}${card('link','link','Связать с материалом каталога','То же подтверждённое изделие под другим названием или от другого поставщика.',['выбор существующей карточки','название поставщика сохраняется как соответствие','заявка и остаток не дублируются'],'cdMatch')}${card('diff','alert','Товар отличается от документа','Получен другой товар или другое количество.',['отдельное расхождение, оригинал не переписан','товар заблокирован до корректного оформления','это не синоним и не коэффициент фасовки'],'cdDiff')}</div>`,
   btn('К документу','cdDoc',String(r.n),'','left'),{wide:true});}
/* CATDOC-01 */
function cdOcr(n){const r=cdRow(n);

   CD_DEMO+`<div class="cd-split"><div class="cd-col doc"><h3>Фрагмент оригинала</h3>${cdSource(r.n)}</div><div class="cd-col"><h3>Расшифровка поля «Количество»</h3><dl class="cd-kv"><dt>Машинное значение</dt><dd><span class="cd-ocrval ${r.fixed?'old':''}">${esc(r.machine)}</span> ${esc(r.unit)}</dd></dl><div class="fields mt16"><div class="full"><label class="label" for="cdOcrValue">Значение по оригиналу</label><input class="text" id="cdOcrValue" inputmode="decimal" value="${esc(r.fixed||r.printed)}"></div><div class="full"><label class="label" for="cdOcrNote">Что было не так (необязательно)</label><input class="text" id="cdOcrNote" placeholder="Например: запятая вместо нуля"></div></div><label class="checkbox kit-check-label mt16"><input class="kit-check" type="checkbox" id="cdOcrChecked">Сверено с изображением оригинала, а не с памятью или счётом</label>${notice('Исправление меняет только результат распознавания. Приход не создаётся: фактическое количество подтверждается отдельно при приёмке.','info')}<div class="mt16"><h3>История поля</h3>${cdHistHTML(x=>x.ref==='Строка '+r.n)}</div></div></div>`,
   btn('Назад','cdLine',String(r.n),'','left')+btn('Сохранить исправление','cdOcrSave',String(r.n),'primary','check'),{wide:true});}
ACTIONS.cdOcrSave=n=>{const r=cdRow(n),v=$('#cdOcrValue').value.trim();if(!v)return errorForm('Укажите значение, напечатанное в оригинале.');if(!$('#cdOcrChecked').checked)return errorForm('Подтвердите сверку с изображением оригинала.');
  r.fixed=v;r.fixedBy=ROLES[S.ui.role].name+' · '+cdNow();r.state='ocrFixed';cdHist('Исправлено распознавание',`Количество: машинное «${r.machine}» → по оригиналу «${v}». Оригинал сохранён. Приход не создан.${$('#cdOcrNote').value.trim()?' Примечание: '+$('#cdOcrNote').value.trim():''}`,'Строка '+r.n);
  toast('Расшифровка исправлена. Поступление не создано — факт подтверждается при приёмке.');cdDoc(r.n);};
/* CATDOC-02 / 03 / 09-11 */
const CD_CANDIDATES={2:[{mid:'estelite',rows:[['Модель','Asteria','Asteria','ok'],['Оттенок','A2B','A2B','ok'],['Фасовка','4 г · шприц','4 г · шприц','ok'],['Производитель','Tokuyama (по упаковке)','Tokuyama','ok'],['Артикул','МК-44120 (МедКомплект)','DM-000004 (ДентМаркет)','unk']]},{mid:'esflow',rows:[['Модель','Asteria','Flow','bad'],['Оттенок','A2B','A2','bad'],['Фасовка','4 г · шприц','3,8 г · шприц','bad'],['Производитель','Tokuyama (по упаковке)','Tokuyama','ok'],['Артикул','МК-44120','DM-000006','unk']]},{mid:'harmonize',rows:[['Модель','Asteria','Harmonize','bad'],['Оттенок','A2B','A2E','bad'],['Фасовка','4 г · шприц','4 г · шприц','ok'],['Производитель','Tokuyama (по упаковке)','Kerr','bad'],['Артикул','МК-44120','DM-000005','unk']]}]};
function cdMatch(n){const r=cdRow(n);const cands=CD_CANDIDATES[r.n]||[];
  const mark={ok:['Совпадает','is-good'],bad:['Отличается','is-bad'],unk:['Не доказывает','is-unk']};
  openModal('Связать с материалом каталога · строка '+r.n,'Система предлагает совпадения. Решение принимает закупщик.',
   CD_DEMO+`<div class="cd-col doc"><h3>Из документа</h3><dl class="cd-kv"><dt>Название поставщика</dt><dd>${esc(r.text)}</dd><dt>Поставщик</dt><dd>${supplier(CD().doc.supplier).name} · артикул ${esc(r.article||'—')}</dd><dt>Количество · цена</dt><dd>${esc(r.printed)} ${esc(r.unit)} · ${rub(r.price)}</dd></dl></div>`+
   (cands.length?`<h3 class="mt24">Похожие карточки — проверьте характеристики</h3>${cands.map((c,i)=>{const m=material(c.mid),good=c.rows.filter(x=>x[3]==='ok').length;return `<div class="panel mt16"><div class="panelhead"><div><h2>${esc(m.name)}</h2><p>${esc(m.uid)} · ${esc(m.spec)}</p></div>${badge(good+' из '+c.rows.length+' характеристик совпадают',i===0?'green':'outline')}</div><div class="tablewrap"><table class="data cd-vs"><thead><tr><th>Характеристика</th><th>В документе</th><th>В карточке</th><th>Проверка</th></tr></thead><tbody>${c.rows.map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td class="${mark[x[3]][1]}">${mark[x[3]][0]}</td></tr>`).join('')}</tbody></table></div><div class="panelbody row between wrap" style="padding:12px 16px"><span class="small muted">${i===0?'Прежние соответствия: ДентМаркет «Estelite Asteria A2B шприц 4 г»':'Совпадение бренда не доказывает тождество'}</span>${btn('Связать с этой карточкой','cdLink',r.n+'~'+c.mid,'small','link')}</div></div>`;}).join('')}`:'')+
   `<div class="mt16">${notice('Совпадение цены, бренда или похожего слова само по себе не доказывает тождество. Модель, оттенок, объём и фасовка проверяются. Один артикул разных поставщиков не является общим идентификатором.','info')}</div><div class="panel pad mt16"><h3>Подходящей карточки нет?</h3><p class="small muted mt8">Новая карточка создаётся только явным решением уполномоченного пользователя. Если соответствие неясно — оставьте строку на уточнение.</p><div class="row wrap mt16">${btn('Создать новую карточку…','cdNewCard',String(r.n),'','plus')}${btn('Оставить на уточнение','cdPending',String(r.n),'','clock')}</div></div>`,
   btn('Назад','cdLine',String(r.n),'','left'),{wide:true});}
ACTIONS.cdLink=a=>{const [n,mid]=a.split('~'),r=cdRow(n),m=material(mid);
  openModal('Подтвердить связь','Строка '+r.n+' → '+m.name,`<div class="cd-flow"><span class="node">«${esc(r.text)}»<small>${supplier(CD().doc.supplier).name} · ${esc(r.article||'')}</small></span>${icon('right')}<span class="node is-event">${esc(m.name)}<small>${esc(m.uid)}</small></span></div><div class="cd-checks mt16">${[['Название поставщика сохранится как его соответствие этой карточке','Поиск по «'+r.text+'» найдёт ту же карточку'],['Новая карточка, потребность или заказ не создаются','Заявки ссылаются на '+m.uid+', а не на текст названия'],['Остаток не дублируется','Приход этой строки попадёт в ту же карточку после приёмки']].map(([a,b])=>`<div class="cd-check ok">${icon('check')}<div><b>${a}</b><p>${b}</p></div></div>`).join('')}</div><label class="checkbox kit-check-label mt16"><input class="kit-check" type="checkbox" id="cdLinkChecked">Характеристики проверены по упаковке и документу, это то же изделие</label>`,btn('Назад','cdMatch',n,'','left')+btn('Связать','cdLinkSave',a,'primary','link'));};
ACTIONS.cdLinkSave=a=>{const [n,mid]=a.split('~'),r=cdRow(n),m=material(mid);if(!$('#cdLinkChecked').checked)return errorForm('Подтвердите проверку характеристик.');
  r.state='linked';r.linked=mid;const list=(CD().supplierLinks[mid]??=[]);if(!list.some(x=>x.text===r.text))list.push({supplier:supplier(CD().doc.supplier).name,text:r.text,article:r.article||'—',verified:date(S.ui.date)+' · '+ROLES[S.ui.role].name});
  if(!m.aliases.some(x=>x.text===r.text))m.aliases.push({text:r.text,kind:'Название поставщика',source:supplier(CD().doc.supplier).name+' · '+(r.article||''),at:S.ui.date});
  cdHist('Связано с каталогом',`«${r.text}» → ${m.name} (${m.uid}). Новая карточка и новая потребность не созданы.`,'Строка '+r.n);toast('Строка связана с '+m.uid+'. Дубль карточки не создан.');cdDoc(r.n);};
ACTIONS.cdNewCard=n=>{const r=cdRow(n);openModal('Создать новую карточку?','Только если подходящей карточки действительно нет',notice('Система не создаёт карточку из текста документа автоматически. Похожие карточки: '+(CD_CANDIDATES[r.n]||[]).map(c=>material(c.mid).name).join(', ')+'.')+`<label class="checkbox kit-check-label mt16"><input class="kit-check" type="checkbox" id="cdNewChecked">Я сравнила характеристики: ни одна карточка не описывает это изделие</label>`,btn('Назад','cdMatch',n,'','left')+btn('Перейти к новой карточке','cdNewGo',n,'primary','plus'));};

function cdDiff(n){const r=cdRow(n);if(r.state==='disc')return cdDisc(r.disc);const a=r.actual||{desc:'',unit:r.unit,qty:''};const same=String(a.qty)===String(r.printed);

  const ret=S.returns.filter(r=>r.entity===S.ui.entity&&r.mid===mid&&r.stage!=='Закрыт');
  const extra=(CD().links[mid]||[]);
  const deliveries=[...inv.map(i=>({t:`Счёт ${i.id} · ${i.paid>=i.amount-i.adjustment?'оплачен':i.paid?'частично оплачен':'не оплачен'} · поставка не завершена`,a:'orderDetail',arg:i.id})),...ord.map(o=>({t:`Заказ ${o.id} · не получен полностью`,a:'orderDetail',arg:o.id})),...extra.map(x=>({t:`${x.kind}: ${x.doc} · ${x.detail}`,a:x.action,arg:x.arg}))];
  return [
   {ok:v.q===0,title:'Остаток',text:v.q?displayQ(mid,v.q)+' — переносится только по подтверждённому основанию':'Нет учётного остатка',block:v.q>0},
   {ok:res===0,title:'Резерв',text:res?displayQ(mid,res)+' ожидает выдачи':'Резерва нет',block:res>0},
   {ok:!reqs.length,title:'Незакрытые заявки',text:reqs.length?reqs.map(r=>r.id+' · '+r.recipient).join(', '):'Нет',block:reqs.length>0,a:reqs[0]&&['requestDetail',reqs[0].id]},
   {ok:!deliveries.length,title:'Заказы и ожидаемые поставки',text:deliveries.length?deliveries.map(d=>d.t).join('; '):'Нет',block:deliveries.length>0,a:deliveries[0]&&[deliveries[0].a,deliveries[0].arg]},
   {ok:!ret.length,title:'Возвраты поставщику',text:ret.length?ret.map(r=>r.id).join(', '):'Нет',block:ret.length>0},
   {ok:true,title:'Внешние связи iDent',text:(CD().ident[mid]||[]).length?'Связь сохранится; новые события по ней уйдут в очередь уточнения':'Нет',block:false}];}
function cdArchiveCheck(mid){const m=material(mid);const checks=cdArchiveChecks(mid),blocked=checks.some(c=>c.block);
  openModal('Убрать из новых заказов · проверка связей',m.name+' · '+m.uid,(m.cdKind?CD_DEMO:'')+(blocked?`<div class="cd-lock">${icon('alert')}<div><b>Есть незакрытые связи — карточку пока нельзя вывести</b>Сначала завершите или перенесите их по подтверждённому основанию.</div></div>`:notice('Незакрытых связей нет. Карточка будет скрыта из выбора для новых заявок.','success'))+
   `<div class="cd-checks mt16">${checks.map(c=>`<div class="cd-check ${c.ok?'ok':'warn'}">${icon(c.ok?'check':'alert')}<div><b>${c.title}</b><p>${esc(c.text)}</p></div>${c.a?btn('Открыть',c.a[0],c.a[1],'small','right'):''}</div>`).join('')}</div>`+
   `<div class="mt16">${notice('Физическое удаление использовавшейся карточки недоступно. Документы, движения, прежние цены и поиск истории сохраняются. Нулевой остаток не означает отсутствия поставок, резервов и возвратов.','info')}</div>`,
   btn('Назад','materialDetail',mid,'','left')+(blocked?btn('Напомнить после закрытия связей','cdArchiveLater',mid,'','clock'):btn('Убрать из новых заказов','cdArchiveGo',mid,'primary','check')),{wide:true});}
const v12ArchiveBase=ACTIONS.archiveMaterial;
ACTIONS.archiveMaterial=a=>{const m=material(a);if(!m)return;if(m.archived)return v12ArchiveBase(a);cdArchiveCheck(a);};
ACTIONS.cdArchiveGo=a=>v12ArchiveBase(a);
ACTIONS.cdArchiveLater=a=>{const m=material(a);m.retirePending=true;record('Каталог','Вывод карточки отложен до закрытия связей','',a);toast('Карточка остаётся доступной. Напоминание — после закрытия связей.');closeModal();};
/* CATDOC-14/15, AC-07: split a generic card by confirmed composition */
const CD_SPLIT=[['b05',3],['b10',2],['b13',1]];
function cdSplit(){const g=material('burGeneric'),v=stock('burGeneric'),done=CD().split;
  openModal('Разделить «Бор алмазный» по составу',g.uid+' · обобщённая позиция старого справочника',CD_DEMO+
   `<dl class="kv"><div><dt>Учётный остаток на карточке</dt><dd>${displayQ('burGeneric',v.q)}</dd></div><div><dt>Исторические движения</dt><dd>Остаются на обобщённой позиции · задним числом не распределяются</dd></div><div><dt>iDent</dt><dd>Присылает «Бор алмазный» агрегированно → очередь уточнения, без автоназначения</dd></div><div><dt>Основание</dt><dd>Инвентаризация И-ДЕМО-0922 · подтверждённый состав</dd></div></dl>`+
   (done?notice(`Разделение выполнено: ${done.moved} шт перенесено на точные карточки, ${done.rest} шт остаются неразобранным остатком.`,'success'):
   `<h3 class="mt24">Подтверждённый состав → точные карточки</h3><div class="mt8">${table(['Точная карточка','Подтверждено инвентаризацией','Перенести'],CD_SPLIT.map(([mid,q])=>{const m=material(mid);return [titlecell(m.name,m.uid+' · '+m.factor+' шт в упаковке'),numbercell(q+' упак · '+q*m.factor+' шт'),`<span class="qtyunit"><input type="number" class="qty" min="0" data-cdsplit="${mid}" value="${q}" aria-label="Перенести на ${esc(m.name)}"><small>упак</small></span>`];}),{mcompact:true})}</div><div class="cd-sum mt16" id="cdSplitSum"></div><div class="mt16">${notice('Карточку нельзя переименовать в первый встретившийся артикул. Неизвестная часть остаётся явно неразобранной; открытые заявки на «бор алмазный» уточняются у автора по фактической потребности.','info')}</div><label class="checkbox kit-check-label mt16"><input class="kit-check" type="checkbox" id="cdSplitChecked">Состав подтверждён инвентаризацией; неизвестную часть не распределяю</label>`),
   btn('Закрыть','closeModal')+(done?'':btn('Разделить по подтверждённому составу','cdSplitSave','','primary','grid')),{wide:true});cdSplitSum();}
function cdSplitSum(){const box=$('#cdSplitSum');if(!box)return;const total=stock('burGeneric').q;let moved=0;for(const el of $$('[data-cdsplit]'))moved+=(+el.value||0)*material(el.dataset.cdsplit).factor;box.innerHTML=`<span>Всего на карточке <b>${total} шт</b></span><span>Переносится <b>${moved} шт</b></span><span class="rest">Неразобранный остаток ${Math.max(0,total-moved)} шт — остаётся в очереди уточнения</span>${moved>total?'<span class="rest">Переносится больше, чем числится</span>':''}`;}
document.addEventListener('input',e=>{if(e.target.matches('[data-cdsplit]'))cdSplitSum();});
ACTIONS.cdSplitSave=()=>{if(!$('#cdSplitChecked').checked)return errorForm('Подтвердите основание разделения.');const g=stock('burGeneric');let moved=0;const plan=$$('[data-cdsplit]').map(el=>({mid:el.dataset.cdsplit,q:(+el.value||0)*material(el.dataset.cdsplit).factor}));moved=plan.reduce((a,p)=>a+p.q,0);if(plan.some(p=>!Number.isInteger(p.q)||p.q<0))return errorForm('Количество — целые упаковки.');if(moved>g.q)return errorForm('Переносится больше, чем числится на обобщённой карточке.');
  for(const p of plan){if(!p.q)continue;const v=stock(p.mid);v.q+=p.q;v.places['Помещение склада']=(v.places['Помещение склада']||0)+p.q;record('Разделение карточки',`Бор алмазный → ${material(p.mid).name} · по инвентаризации`,'И-ДЕМО-0922',p.mid,p.q,lineCost(p.mid,p.q)||0);}
  g.q-=moved;debitPlaces(g,moved);CD().split={moved,rest:g.q};material('burGeneric').spec='Неразобранный остаток · очередь уточнения';record('Разделение карточки',`Бор алмазный: ${moved} шт перенесено, ${g.q} шт — неразобранный остаток`,'И-ДЕМО-0922','burGeneric',-moved,0);save();toast('Разделено по подтверждённому составу. Неразобранный остаток сохранён.');closeModal();render();cdSplit();};
/* CATDOC-16, AC-10: duplicate cards with one repeated receipt */
function cdDup(){const a=material('gloves'),b=material('glovesDup');const va=stock('gloves'),vb=stock('glovesDup'),done=CD().dup;
  const qa=va.q/a.factor,qb=vb.q/b.factor;
  const rows=[['ID',a.uid,b.uid],['Остаток по местам',Object.entries(va.places).filter(([,q])=>q>0).map(([p,q])=>p+': '+num(q/a.factor)+' упак').join('; ')||'—',Object.entries(vb.places).filter(([,q])=>q>0).map(([p,q])=>p+': '+num(q/b.factor)+' упак').join('; ')||'—'],['Единица',a.unit+' · '+a.contentQty+' '+a.contentUnit,b.unit+' · '+b.contentQty+' '+b.contentUnit],['Партии','ДЕМО-0926','ДЕМО-0926'],['Стоимость',rub(lineCost('gloves',va.q)),rub(lineCost('glovesDup',vb.q))],['Резервы',displayQ('gloves',pendingQty('gloves')),displayQ('glovesDup',pendingQty('glovesDup'))],['Незакрытые заявки',S.requests.filter(r=>r.lines.some(l=>l.mid==='gloves'&&openQ(l)>0)).length+' заявок','0'],['Внешние связи','iDent: нет','iDent: нет'],['Приходы','У-ДЕМО-061 · 30 упак; <b>У-ДЕМО-077 · 10 упак · 03.08</b>','<b>У-ДЕМО-077 · 10 упак · 03.08</b>']];
  openModal('Сверка дублей карточек','Перчатки нитриловые S',CD_DEMO+(done?notice(`Дубль перенаправлен на ${a.uid}. Ошибочный повтор прихода исправлен документированно: −10 упак. Итог — ${num(qa)} упак, не ${num(qa+10)}.`,'success'):`<div class="cd-lock">${icon('copy')}<div><b>Найден повтор прихода</b>Документ У-ДЕМО-077 (10 упак) учтён в обеих карточках. Физически получено один раз.</div></div>`)+
   `<div class="panel mt16"><div class="tablewrap"><table class="data cd-vs"><thead><tr><th>Показатель</th><th>Основная карточка</th><th>Старая карточка</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></div>`+
   (done?'':`<div class="cd-sum mt16"><span>Простое сложение: <b>${num(qa+qb)} упак</b></span><span>После сверки: <b>${num(qa)} упак</b> · стоимость ${rub(lineCost('gloves',va.q))}</span><span class="rest">Повтор ${num(qb)} упак не удваивает запас</span></div><div class="mt16">${notice('Операция не является новой закупкой. Для точного дубля разрешено явное перенаправление на основную карточку; история старой карточки сохраняется.','info')}</div><label class="checkbox kit-check-label mt16"><input class="kit-check" type="checkbox" id="cdDupChecked">Проверила: У-ДЕМО-077 — один и тот же приход в двух карточках</label>`),
   btn('Закрыть','closeModal')+(done?'':btn('Перенаправить дубль и исправить повтор','cdDupSave','','primary','link')),{wide:true});}
ACTIONS.cdDupSave=()=>{if(!$('#cdDupChecked').checked)return errorForm('Подтвердите найденный повтор.');const b=material('glovesDup'),vb=stock('glovesDup'),q=vb.q;vb.q=0;vb.places={};b.archived=true;b.redirect='gloves';CD().dup={q};record('Корректировка','Ошибочный повтор прихода У-ДЕМО-077 в дубле карточки · перенаправлено на '+material('gloves').uid,'У-ДЕМО-077','glovesDup',-q,0);save();toast('Дубль перенаправлен. Запас не удвоен.');closeModal();render();cdDup();};
/* Review page: separate CATDOC list (launchAC parses numeric ids only) */
function cdLaunch(id){S.ui.role='buyer';S.ui.entity='main';S.ui.state='normal';S.settings.offline=false;const n=+id.slice(-2);
  const route=[1,3,4,5,6,11].includes(n)?'receipts':'stock';navigate(route,n===6?'disputes':'');S.ui.scenario=id;render();
  if(n===1)cdOcr(1);else if(n===2)materialDetail('estelite~ids');else if(n===3)cdMatch(2);else if(n===4)cdDiff(3);else if(n===5)cdDiff(4);
  else if(n===6){const d=cdEnsureDisc(3);if(d.stage==='Заблокировано до проверки'){d.stage='Запрошены корректные документы';d.request=date(S.ui.date)+' · учебный запрос';}save();render();cdCorrection(d.id);}
  else if(n===7)cdSplit();else if(n===8)materialDetail('implant~ids');else if(n===9)cdArchiveCheck('fujiOld');else if(n===10)cdDup();else if(n===11)cdRescan();save();}
const cdCorrection=id=>ACTIONS.cdCorrection(id);
const V12_REVIEW_TABS=[['guides','Начать проверку'],['acceptance','84 сценария ТЗ'],['requirements','Все пункты ТЗ'],['feedback','Замечания']];
const v12ReviewBase=reviewPage;
reviewPage=function(){const tab=S.ui.tab||'guides',tabs=[...V12_REVIEW_TABS.slice(0,2),['catdoc','CATDOC · 11 сценариев'],...V12_REVIEW_TABS.slice(2)];
  if(tab!=='catdoc')return v12ReviewBase().replace(seg(V12_REVIEW_TABS,tab),seg(tabs,tab));
  const topHtml=head('Проверить макет','Пошаговые маршруты, все 84 сценария ТЗ, 11 сценариев CATDOC и замечания сотрудницы. Нет автоматической отметки «всё принято».',btn('Выгрузить замечания','exportFeedback','','primary','download'))+`<div class="toolbar">${seg(tabs,'catdoc')}<span class="spacer"></span>${btn('Сбросить учебные данные','resetConfirm','','','refresh')}</div>`;
  return topHtml+notice('Уточнение приёмки и единого каталога (ТЗ v2.0, гл. 24). Каждый сценарий открывает экран, где проверяется ожидаемый результат. Нумерация отдельная; 84 прежних сценария не перенумерованы.','info')+`<div class="stack mt16">${CD_AC.map(a=>{const st=S.reviews[a.id];return `<article class="reviewcard"><span class="rid">${a.id.replace('AC-CATDOC-','CD-')}</span><div class="grow"><div class="row between wrap"><h3>${esc(a.title)}</h3>${badge(st?.status==='ok'?'Проверено пользователем':st?.status==='change'?'Есть замечание':'Не проверено',st?.status==='ok'?'green':st?.status==='change'?'amber':'outline')}</div><p><b>Ожидается:</b> ${esc(a.expected)}</p><p class="tiny muted">${esc(a.id)} · ${esc(a.path)}</p><div class="row wrap mt16">${btn('Открыть сценарий','cdLaunch',a.id,'small','right')}${btn('Результат / замечание','scenarioFeedback',a.id,'small','message')}</div></div></article>`;}).join('')}</div>`;};
const v12BalBase=fbBalanceDetail;fbBalanceDetail=function(r){V12_LEGACY_EMPTY=true;try{v12BalBase(r);}finally{V12_LEGACY_EMPTY=false;}};ACTIONS.fbBalanceDetail=fbBalanceDetail;
const v12ReqBase=requestDetail;requestDetail=function(id){v12ReqBase(id);const r=S.requests.find(x=>x.id===id);if(!r)return;for(const l of r.lines){const m=material(l.mid),old=(m?.aliases||[]).find(a=>a.kind==='Прежнее название');if(!old)continue;const cell=$(`#modalroot td.title [data-arg="${m.id}"]`)?.closest('td');cell?.insertAdjacentHTML('beforeend',`<div class="sub">Ранее называлось «${esc(old.text)}» · та же карточка ${esc(m.uid)}</div>`);}};
Object.assign(ACTIONS,{cdDoc:a=>cdDoc(a||null),cdLine,cdOcr,cdMatch,cdDiff,cdDisc,cdRescan,cdSplit,cdDup,cdArchiveCheck,cdLaunch,requestDetail,materialDetail});
