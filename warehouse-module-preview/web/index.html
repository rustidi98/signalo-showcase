вание создаёт черновик: реквизиты, строки, исходные названия, количество, единица, цена, сумма, налог, доставка. Для спорного поля показывать исходный участок документа и статус «проверить». Каталожные совпадения — предложения; новый товар или неоднозначная фасовка не проводятся молча.", "section": "9. Распознавание документов и приёмка", "sourceLine": 269, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-03", "text": "RCV-03. До проведения проверяются: число страниц, итог документа, суммы строк, фасовка, юрлицо, поставщик, закупочная группа и возможный повтор. Повторный PDF и его фотография могут быть одним документом: одного хеша файла недостаточно. Нужны реквизиты и сравнение содержания с разрешением спорных совпадений человеком.", "section": "9. Распознавание документов и приёмка", "sourceLine": 271, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-04", "text": "RCV-04. В таблице приёмки отдельно «по документу» и «принято фактически». Документ на 30 упаковок при факте 28 не добавляет 30 в остаток. Оставшиеся 2 связываются с ожиданием либо возвратом денег. Приёмщик подтверждает факт; распознавание не подменяет пересчёт. [C:1–29]", "section": "9. Распознавание документов и приёмка", "sourceLine": 273, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-05", "text": "RCV-05. Счёт, даже распознанный без ошибок, не доказывает поступление. Из счёта можно подготовить ожидаемую приёмку, но запас увеличивается только после её подтверждения. Несколько накладных к одному счёту добавляют только фактически принятые по каждой поставке количества.", "section": "9. Распознавание документов и приёмка", "sourceLine": 275, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-06", "text": "RCV-06. Если администратор получил коробку без полной сверки, статус — «Получено, требуется проверка». Такой товар не показывается как свободный проверенный запас. Закупщик проводит сверку позже, видя кто и когда принял доставку. Точное разделение полномочий приёмки принимается с ТЗ.", "section": "9. Распознавание документов и приёмка", "sourceLine": 277, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-07", "text": "RCV-07. Неверно привезённые, повреждённые или ожидающие возврата позиции отделены от доступного запаса. Замена не перезаписывает старую строку прихода: сохраняются ошибочная поставка, возврат и правильное поступление. История обменов доступна в карточке поставщика и материала.", "section": "9. Распознавание документов и приёмка", "sourceLine": 279, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-08", "text": "RCV-08. Для материалов, где это задано, фиксируются партия, серийный номер и срок годности с упаковки/документа; неизвестное не заполняется предположением. Связь партии с выдачей позволяет найти получателей. Обязательность юридически значимого обмена с маркировкой проверяется отдельно; поле QR не объявляется интеграцией с внешней системой. [C:31–39]", "section": "9. Распознавание документов и приёмка", "sourceLine": 281, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-09", "text": "RCV-09. Доказательства партии (v1.1). Для настроенных групп сохранять исходные сведения партии/серии/срока и фото этикетки либо отрывного кода как вложение конкретного прихода/партии. Сотрудница отдельно назвала применяемые обезболивающие препараты и практику сохранения кодов. Не превращать её слова в универсальное правовое требование для всех товаров. Раннюю историю партий, которую она не обещала предоставить, нельзя восстанавливать догадкой. На основе связей выдачи можно найти известные кабинеты/получателей партии; нельзя обещать список пациентов без отдельного подтверждённого источника. Хранение QR/фото не означает выполненный обмен с «Честным знаком». [C:31–35, 191–199]", "section": "9. Распознавание документов и приёмка", "sourceLine": 283, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "SAFE-01", "text": "SAFE-01. Избирательный учёт вскрытия (v1.1). Отсутствие ежедневного граммового учёта не отменяет упомянутые отдельные случаи: долгосрочные материалы/аптечка и остаток хирургической упаковки после вскрытия, когда клиника решила его фиксировать. Для таких настроенных позиций разрешены дата вскрытия, известный остаток в подтверждённой единице или качественная отметка «остаток не измерен», сведения упаковки и статус доступности. Это необязательный режим, включаемый только после определения ответственного и правила клиники. Система не рассчитывает допустимое повторное применение или срок после вскрытия по предположению; сомнительный остаток не становится автоматически новым свободным материалом. Обычные композиты/перчатки не получают обязательный ежедневный ввод. [C:37–39; F:15–21. Поля и режим — проектный способ сохранить исключение.]", "section": "9. Распознавание документов и приёмка", "sourceLine": 285, "scope": "Интерфейс и локальная модель", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "SAFE-02", "text": "SAFE-02. Просрочка и блокировка (v1.1). Запас с подтверждённо истёкшим сроком, повреждённый либо ожидающий решения по пригодности отделён от доступного к выдаче. В карточке видны причина, источник срока и ответственный. Он остаётся в учётном количестве до документированного выбытия/возврата; блокировка не означает автоматическое уничтожение, бесплатное исчезновение или второе списание. Если точный срок неизвестен, качество данных явно указано; политика доступности такой группы утверждается отдельно. Проверка срока выполняется также на момент подтверждения выдачи, а не только при загрузке накладной. [C:31–39, 211–217; U:исходная потребность контроля актуальности. Механизм блокировки — проектное решение.]", "section": "9. Распознавание документов и приёмка", "sourceLine": 287, "scope": "Интерфейс и локальная модель", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-10", "text": "RCV-10. Проверка страниц до проведения. Система предлагает границы документов по номерам, заголовкам, напечатанным номерам листов и общему числу листов. Пропущенная, дублированная, чужая или нечитаемая страница требует проверки именно затронутого документа. Порядок сканирования не определяет хронологию. Общий итог трёхлистового УПД относится к документу один раз, а не умножается на число страниц и не считается отдельным приходом. Повторяющиеся заголовки/подвалы не становятся товарными строками. В интерфейсе показывать прогресс «3 документа / 6 страниц», а не «6 накладных». [D5]", "section": "9. Распознавание документов и приёмка", "sourceLine": 291, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-11", "text": "RCV-11. Повтор строки не равен дублю. Ключ исходной строки включает логический документ, его версию, номер строки и страницу; товарный код хранится строкой с ведущими нулями. Одинаковые артикулы/описания в разных строках не удаляются. Сохранять различающиеся реквизиты происхождения, включая страну и напечатанный номер декларации/прослеживаемости; этот номер не переименовывать в «партию» без основания. В сводке можно суммировать проверенные одинаковые спецификации, но раскрытие показывает каждую исходную строку и её документ. Подозрение на повтор файла проверяется независимо от допустимого повтора товара. [D4: стр.1–2; D5: стр.2–4, в частности строки 13–15 УПД 2-21838]", "section": "9. Распознавание документов и приёмка", "sourceLine": 293, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-12", "text": "RCV-12. Печатные данные, рукописная пометка и факт. Хранить отдельно напечатанное количество, возможную рукописную отметку с фрагментом страницы, предложенное распознавание и проверенный человеком факт приёмки. Не заменять печатную «1,000» рукописной цифрой рядом без подтверждения смысла отметки. Галочка, печать, подпись или её отсутствие не дают алгоритму права подтвердить количество или поступление автоматически. Исправление факта не переписывает скан и печатные значения; документируется расхождение. Нечитаемая дата получения остаётся неизвестной. [D5: стр.5, строка 2; D2: стр.1]", "section": "9. Распознавание документов и приёмка", "sourceLine": 295, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-13", "text": "RCV-13. Напечатанная цена и расчёт по итогу. Сохранить количество, цену из печатной колонки, итог строки и явные налог/скидку по источнику. Если количество × печатная цена не равно итогу, нельзя молча «исправить» сумму счёта или дополнительно начислить скидку. Можно показать расчётную итоговую цену = итог строки / количество и предположение о причине разницы; включение в учёт требует проверки выбранной денежной базы. В D4 строка 1: 3 упаковки × 1 464,00 ₽ = 4 392,00 ₽, напечатанный итог 3 733,20 ₽; отношение соответствует 15% уменьшению, а расчётная цена 1 244,40 ₽ совпадает с ценой соответствующего товара в D5. Отдельная графа скидки в этом счёте отсутствует. Это арифметическое наблюдение, не подтверждение постоянной скидки поставщика и не ошибка документа, которую можно самовольно исправить. При сопоставлении счёта и УПД сравнивать эквивалентные итоговые цены и одинаковые единицы. «Без НДС», прочерк, пустое поле и известная нулевая сумма сохраняются различимо. [D4: стр.1, строка 1; D5: стр.2, строка 1; FIN-04]", "section": "9. Распознавание документов и приёмка", "sourceLine": 297, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-14", "text": "RCV-14. Фасовка и близкие спецификации. В D4/D5 одна «упак» содержит 1 либо 5 изделий в зависимости от товара. «3,000 упак» означает три упаковки; код единицы 778 не является количеством, а «5 шт» внутри описания — возможный коэффициент конкретной фасовки, который требуется подтвердить. Сохранять модель, FG/RA/HP и прочие значимые обозначения, диаметр/размер, фасовку; разные обозначения 801 / 801G / 801H не объединять по похожести. Сводка переводит упаковки в штуки только по проверенному коэффициенту. Число строк документа не равно количеству уникальных товаров или упаковок. [D4: стр.1–2; D5: стр.1–6; UOM-01–03]", "section": "9. Распознавание документов и приёмка", "sourceLine": 299, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "RCV-15", "text": "RCV-15. Сверка счёта и набора поставок. По каждой проверенной спецификации показывать исходное количество/сумму счёта, покрытие каждой связанной накладной, подтверждённое фактическое получение и незакрытое количество отдельно. Сверка документов и подтверждение физической приёмки — разные режимы: скан сам не проводит запасы. Общая сумма служит контрольной проверкой, но её совпадение не закрывает заказ с неверным ассортиментом, другой фасовкой или перепоставкой одной позиции вместо недопоставки другой. Возможные состояния: не сопоставлено, покрыто документами, частично покрыто, превышение количества, расхождение цены/единицы, приёмка не подтверждена. Несопоставленная строка не теряется; при реальном получении её можно оформить как явно незапланированное поступление, не закрывающее чужую потребность автоматически. Остаток по имеющимся сканам не объявляется фактическим долгом/нарушением поставщика: может отсутствовать ещё один документ, корректировка или подтверждение. Физический возврат уменьшает покрытие поставкой; ожидаемая замена остаётся открытой. Только подтверждённая отмена соответствующего обязательства снимает эту часть с ожидания. Возврат денег не меняет количество повторно; допоставка и повтор скана не добавляют второй расход в бюджет. [D4/D5; DOC-06; PAY-06; REQ-09]", "section": "9. Распознавание документов и приёмка", "sourceLine": 301, "scope": "Учебная имитация интеграции", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "ISS-01", "text": "ISS-01. Ассистент на телефоне выбирает получателя и добавляет реально взятые материалы с количествами. Можно заполнить документ из подготовленной заявки, но фактическое количество всегда подтверждается. В одном документе допустимо около 20 и более строк, без двадцати отдельных согласований. Закупщик видит тот же список. [F:131–141]", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 307, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-02", "text": "ISS-02. Первое подтверждение получателя создаёт резерв и состояние «Передача ожидает подтверждения». Свободное количество сразу уменьшается. Учётное проведение выполняется после второго подтверждения уполномоченного выдающего. Запрещены две подписи одного пользователя; заместитель, получающий сам, ждёт подтверждения закупщика. Третья подпись врача для v1 не требуется. [F:133–153]", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 309, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-03", "text": "ISS-03. Для расходуемого при выдаче материала проводится расход на кабинет/врача. Для отслеживаемого инструмента — закрепление. Для импланта, который перемещается в место хранения того же центрального запаса, — изменение размещения, а не расход. Все три случая различаются по режиму карточки и типу операции.", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 311, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-04", "text": "ISS-04. Обе подписи связаны с одной версией документа. Исправление состава/количества после первой подписи снимает её применимость и запрашивает повторное подтверждение. Резерв корректируется атомарно; нельзя увеличить количество сверх доступного, пока ассистент подтверждает старую версию.", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 313, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-05", "text": "ISS-05. Основной срок второй подписи — тот же рабочий день. При задержке документ становится просроченным в очереди; на следующее рабочее утро виден отдельный список. Автоматического подтверждения, списания, снятия резерва или возвращения товара «по таймеру» нет. Точное время напоминаний — настройка внедрения. [F:143–153]", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 317, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-06", "text": "ISS-06. В документе отдельно хранить время фактического получения и время каждой подписи. Поздняя подпись не маскируется под своевременную. В аналитике показывать незавершённые выдачи, чтобы запас «по проведённому учёту» не смешивался со свободным к выдаче.", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 319, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-07", "text": "ISS-07. Если товар уже физически забрали, отклонение документа запускает выяснение факта: подтвердить исправленный состав, вернуть фактически полученное или оформить расхождение. Простая кнопка «Отмена» не делает ушедшие упаковки свободными.", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 321, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-08", "text": "ISS-08. При программном нуле и найденном физическом товаре закупщик фиксирует расхождение и, если подтверждено, оформляет корректирующее поступление/исправление единицы до проведения обычной выдачи. Из ответа не следует разрешение неконтролируемого отрицательного остатка. Срочное документирование допускается как исключение, а не бесследная правка карточки. [F:155–161]", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 323, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-09", "text": "ISS-09. Постоянный экран показывает незавершённые документы, получателя, время, количество строк, спорные строки и одно действие подтверждения документа. Разрешённая пакетная работа не должна превращаться в «подписать всё, не видя различий». На телефоне список не требует возвращаться к настольному компьютеру.", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 325, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "ISS-10", "text": "ISS-10. Два независимых результата документа (v1.1). После второй подписи документ фиксирует исполненное количество конкретной потребности и отдельный вид складского эффекта. Для имплантов размещение в хирургическом кабинете может исполнить заявку без расхода центральной зоны; для обычной упаковки одновременно исполняет заявку и создаёт расход. Связи этих результатов хранятся явно; повтор подписи не повторяет ни один из эффектов. Если выдача вне заявки, новая фиктивная закупочная потребность не создаётся. [REQ-12; F:75–85; U]", "section": "10. Выдача: одна запись и два подтверждения", "sourceLine": 327, "scope": "Интерфейс и локальная модель", "route": "issues", "tab": "", "path": "Выдачи"}, {"id": "INT-01", "text": "INT-01. Проверка внедрения. Установить первичное событие расхода, устойчивый идентификатор, изменения/отмены, связь с материалом, количеством, врачом, приёмом и источником списания. Нельзя импортировать и первичное списание, и компенсирующую операцию как два расхода. Наличие исторических имён таблиц в репозитории не доказывает готовую интеграцию.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 335, "scope": "Учебная имитация интеграции", "route": "reconcile", "tab": "ident", "path": "Сверка → iDent"}, {"id": "INT-02", "text": "INT-02. Источник iDent не изменяет количество Signalo без однозначного сопоставления материала и смысла события. Неоднозначные записи попадают в компактную очередь исключений. Классификация по одному тексту названия операции без проверки недостаточна.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 337, "scope": "Учебная имитация интеграции", "route": "reconcile", "tab": "ident", "path": "Сверка → iDent"}, {"id": "INT-03", "text": "INT-03. Проектное решение. Входное событие включает: организацию/коннектор; идентификатор источника и ревизию; тип; дату факта; идентификатор материала; количество и единицу; ссылку на исходный документ; доступную атрибуцию врача/приёма. Повтор той же ревизии не проводит расход вновь. Изменение количества создаёт проверенную дельту, а не второй полный расход. Поздние события обрабатываются по watermark с перекрывающимся окном, дедупликацией и сверкой.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 341, "scope": "Учебная имитация интеграции", "route": "reconcile", "tab": "ident", "path": "Сверка → iDent"}, {"id": "INT-04", "text": "INT-04. Отмена финансового счёта сама по себе не возвращает использованный имплант в пригодный запас. Для реального восстановления остатка требуется доказательство ошибочно отражённого расхода либо фактического возврата неиспользованного изделия. Неоднозначная отмена — исключение на проверку.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 343, "scope": "Учебная имитация интеграции", "route": "reconcile", "tab": "ident", "path": "Сверка → iDent"}, {"id": "INT-05", "text": "INT-05. Если расход подтверждён, но учётного остатка не хватает, событие не теряется и не создаёт фиктивное поступление. Оно хранится как неразнесённый подтверждённый расход, уменьшает доступность в расчёте и помечает учёт как требующий сверки; после корректировки/переноса проводится один раз. Нельзя показать такой материал как полностью достоверный ноль без объяснения дефицита.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 345, "scope": "Учебная имитация интеграции", "route": "reconcile", "tab": "ident", "path": "Сверка → iDent"}, {"id": "INT-06", "text": "INT-06. Импланты v1 списываются по согласованной общей позиции, без обязательного размера. Точное расположение списания используется только если доказано источником. При неизвестном расположении общий центральный остаток уменьшается, подробная раскладка по местам помечается как неполная; система не назначает размер, партию или кабинет наугад.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 347, "scope": "Учебная имитация интеграции", "route": "reconcile", "tab": "ident", "path": "Сверка → iDent"}, {"id": "INT-07", "text": "INT-07. Импорт ограничивается согласованной точкой перехода: события до неё уже могли попасть в стартовую инвентаризацию. История для отчёта может загружаться без повторного складского проведения. Повторный запуск коннектора, восстановление после сбоя и смена отображаемого имени не меняют ключ дедупликации.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 349, "scope": "Учебная имитация интеграции", "route": "reconcile", "tab": "ident", "path": "Сверка → iDent"}, {"id": "WRN-01", "text": "WRN-01. Нужен отдельный документ дополнительного подтверждённого расхода по отчёту врача/ассистента: период, общая позиция импланта, количество именно новых использованных изделий, вид случая, ответственный, подтверждение и примечание при необходимости. Возможен ввод нескольких строк одним документом.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 353, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "warranty", "path": "Сверка → Дополнительный расход"}, {"id": "WRN-02", "text": "WRN-02. Термин «перекрут» сохраняется как категория исходного отчёта, но автоматически не приравнивается к расходу нового импланта: исходные ответы не определяют это. В складской расход попадает только подтверждённое количество новых изделий. Уже импортированное обычное использование нельзя повторно вычесть из общего месячного отчёта.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 355, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "warranty", "path": "Сверка → Дополнительный расход"}, {"id": "WRN-03", "text": "WRN-03. Проектное решение. Сверка показывает: расход iDent; отдельно подтверждённые дополнительные расходы; фактический подсчёт; необъяснённая разница. Отчёт врача может уточнять уже учтённое, а не всегда добавлять расход. Повтор отчёта того же периода проверяется на дубли.", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 357, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "warranty", "path": "Сверка → Дополнительный расход"}, {"id": "WRN-04", "text": "WRN-04. Пока дополнительные случаи не подтверждены, остаток обозначается как учётный с неполной сверкой. Ежемесячная подтверждённая сверка не называется гарантией посекундного физического остатка. Полная автоматизация отсутствующих в iDent событий не обещается. [F:45–47; C:201–209]", "section": "11. Расход из iDent, гарантия и сверка", "sourceLine": 359, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "warranty", "path": "Сверка → Дополнительный расход"}, {"id": "TRF-01", "text": "TRF-01. Разделить: смену физического места внутри центрального запаса; выдачу расходника в работу; закрепление инструмента; передачу другой клинике/юрлицу. Одна универсальная кнопка «переместить и списать» для всех случаев запрещена.", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 363, "scope": "Интерфейс и локальная модель", "route": "movements", "tab": "", "path": "Движения"}, {"id": "TRF-02", "text": "TRF-02. Между клиниками: черновик передачи → согласована принимающей стороной → зарезервировано → отправлено/в пути → частично/полностью принято → закрыто либо расхождение/возврат. В документе материалы, единицы, отправитель и получатель, основание, согласованная стоимость передачи, подтверждения и привязанные документы. [F:177–185; A:13–29]", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 365, "scope": "Интерфейс и локальная модель", "route": "movements", "tab": "", "path": "Движения"}, {"id": "TRF-03", "text": "TRF-03. Проектное решение. Учёты самостоятельны. Пока груз в пути, он не является свободным запасом ни у отправителя, ни у получателя. Обе стороны видят свою часть и разрешённые сведения передачи, а не полный склад другой организации. Момент смены владельца и финансовое основание утверждаются ответственными до включения операции; программный перенос не заменяет эти решения.", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 367, "scope": "Интерфейс и локальная модель", "route": "movements", "tab": "", "path": "Движения"}, {"id": "TRF-04", "text": "TRF-04. Приём меньшего количества не закрывает исходную передачу полностью. Недостача в пути, возврат отправителю и стоимость расхождения оформляются отдельно. Нельзя списать все у отправителя и независимо оприходовать все у получателя, потеряв связь и факт недопоставки.", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 369, "scope": "Интерфейс и локальная модель", "route": "movements", "tab": "", "path": "Движения"}, {"id": "TRF-05", "text": "TRF-05. Межюридическая передача не должна автоматически считаться внешним заказом поставщику и попадать в KPI дважды. Раздел «Внутренние передачи» показывает её отдельно до утверждения бюджетной классификации. Отсутствие решения по основанию — видимое ограничение активации, не основание убрать функцию из согласованного объёма.", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 371, "scope": "Интерфейс и локальная модель", "route": "movements", "tab": "", "path": "Движения"}, {"id": "TOOL-01", "text": "TOOL-01. Инструмент закрепляется за кабинетом или врачом с датой, количеством/экземпляром, исходной стоимостью и подтверждением получившего ассистента. Доступен поиск материала сразу по всем разрешённым получателям. При выбытии — отдельный документ и причина: повреждение, потеря, износ или иное.", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 373, "scope": "Интерфейс и локальная модель", "route": "stock", "tab": "tools", "path": "Запас и каталог → Инструменты"}, {"id": "TOOL-02", "text": "TOOL-02. Массовый поиск и списание одной позиции по выбранным кабинетам/врачам поддерживаются с предварительной таблицей количеств и последствий. История не удаляется. Передача имущества при увольнении оформляется перечнем выданного, возвращённого и отсутствующего; личные покупки врача не включаются автоматически в имущество клиники. [A:67–79; U]", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 375, "scope": "Интерфейс и локальная модель", "route": "stock", "tab": "tools", "path": "Запас и каталог → Инструменты"}, {"id": "TOOL-03", "text": "TOOL-03. Временное одалживание «верну вечером» и полный реестр ремонтов не включаются в v1; сохраняются как следующий этап согласно финальному ответу, а не теряются. [F:177–185]", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 377, "scope": "Интерфейс и локальная модель", "route": "stock", "tab": "tools", "path": "Запас и каталог → Инструменты"}, {"id": "TOOL-04", "text": "TOOL-04. Экземплярный и количественный режимы (v1.1). Для согласованных наконечников, ключей, отвёрток и других отслеживаемых дорогих инструментов доступна индивидуальная учётная единица с идентификатором, датой закрепления и историей. Для регулярно заменяемых зеркал, зондов, пинцетов и смотровых наборов допустим количественный учёт без отдельной карточки каждого экземпляра. Настройка выполняется по номенклатуре, не общей ценовой границей. Серийный номер производителя вводится только если есть; обязательная покупка сканеров/маркировка всего ассортимента не требуется. Отсутствие индивидуального номера не делает материал немедленно расходным. [C:165–169; C:117–119]", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 379, "scope": "Интерфейс и локальная модель", "route": "stock", "tab": "tools", "path": "Запас и каталог → Инструменты"}, {"id": "TOOL-05", "text": "TOOL-05. Передаточный акт при завершении ответственности (v1.1). Система формирует перечень имущества клиники, выданного врачу: возвращено, передано новому ответственному, осталось отсутствующим/требует разбора. Предусмотрены подтверждение передающей и принимающей стороны и печатный/выгружаемый документ; отсутствие одной стороны видно, а не подменяется двойной подписью закупщика. Личные приобретения врача исключаются. Инструменты возвращаются ответственному за их учёт; техника, выданная другим подразделением, передаётся назначенному ответственному, включая HR в описанном процессе. Это маршрут передачи и фиксация факта, не автоматически созданная интеграция кадрового учёта или юридически значимая электронная подпись. Полномочия на удержания из зарплаты из этого акта не следуют. [A:67–79]", "section": "12. Перемещения, межклинические передачи и инструменты", "sourceLine": 381, "scope": "Интерфейс и локальная модель", "route": "stock", "tab": "tools", "path": "Запас и каталог → Инструменты"}, {"id": "INV-01", "text": "INV-01. Инвентаризация проводится по юрлицу, центральному запасу и при необходимости группе/физическому месту/отслеживаемому имуществу. Обычные расходники, уже выданные в работу, по граммам и парам не пересчитываются. Основной цикл — ежемесячно, возможна внеплановая проверка исключения. [C:189–227]", "section": "13. Инвентаризация и корректировки", "sourceLine": 385, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "inventory", "path": "Сверка → Инвентаризация"}, {"id": "INV-02", "text": "INV-02. Документ сохраняет учётное количество на момент среза, фактический подсчёт, время подсчёта, расхождение, ответственного и основание корректирующей операции. Инструменты на закреплении инвентаризируются отдельно от свободного запаса.", "section": "13. Инвентаризация и корректировки", "sourceLine": 387, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "inventory", "path": "Сверка → Инвентаризация"}, {"id": "INV-03", "text": "INV-03. Проектное решение. Во время подсчёта использовать либо краткую остановку движений выбранного участка, либо срез с последующей сверкой движений после него. Выбранный режим явно фиксируется; иначе одна упаковка может попасть в подсчёт дважды. Пересчёт двух физических мест не должен удвоить одну учётную группу центрального запаса.", "section": "13. Инвентаризация и корректировки", "sourceLine": 389, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "inventory", "path": "Сверка → Инвентаризация"}, {"id": "INV-04", "text": "INV-04. После утверждения документ неизменяем. Исправление — новая версия сверки/корректирующий документ со ссылкой, а не редактирование исходного столбца «было в системе». События гарантийного расхода не заменяются безымянной недостачей, если причина известна.", "section": "13. Инвентаризация и корректировки", "sourceLine": 391, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "inventory", "path": "Сверка → Инвентаризация"}, {"id": "INV-05", "text": "INV-05. При некорректной единице закупщик уточняет карточку на будущее и оформляет явную корректировку прошлого количества. При неизвестной цене количество может быть подтверждено, но стоимость остаётся неполной. Отсутствие цены не блокирует честный подсчёт и не превращается в нулевую себестоимость.", "section": "13. Инвентаризация и корректировки", "sourceLine": 393, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "inventory", "path": "Сверка → Инвентаризация"}, {"id": "INV-06", "text": "INV-06. Экспорт каталога, текущих остатков, мест, движений, инвентаризации и закупочной истории в табличном формате обязателен с соблюдением прав. Фильтры и единицы сохраняются, дата выгрузки видна. Пользователь не должен снова собирать справочник по скриншотам.", "section": "13. Инвентаризация и корректировки", "sourceLine": 395, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "inventory", "path": "Сверка → Инвентаризация"}, {"id": "FIN-01", "text": "FIN-01. Карточка материала различает последнее предложение поставщика, последнюю фактическую закупочную цену по приёмке, историю цен по датам/поставщикам и оценку текущего запаса. Цена счёта ещё не полученного товара не заменяет подтверждённую цену прошлой поставки.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 401, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "FIN-02", "text": "FIN-02. Суммы документов сохраняются в рублях с явно обозначенной единицей в API/переменной. Количества и коэффициенты не считаются двоичной арифметикой с плавающей точкой. Внутренний Decimal не отдаётся в JSON объектом; точные десятичные строки и сумма в копейках согласуются в контракте. Единичная цена может иметь больше двух знаков внутренней точности; итог строки округляется по определённому правилу, контрольная разница не скрывается.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 403, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "FIN-03", "text": "FIN-03. Проектное решение для согласования. Стоимость остатка v1 оценивать по скользящей средневзвешенной стоимости подтверждённых приходов в пределах самостоятельного учёта материала. Внутреннее перемещение стоимости не создаёт. У отслеживаемого экземпляра сохранять его индивидуальную стоимость; это отдельно от массовой оценки расходников. История исходных приходов хранится независимо от метода оценки. При неполном стартовом стоимостном покрытии показывать неполноту, а не вычислять фиктивную точную среднюю.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 405, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "FIN-04", "text": "FIN-04. Проверка цены, налога и скидки (v1.1). Сохранять исходные цену и сумму строки, отметку включения налога по документу и итоговую стоимость приобретения. Известная включённая сумма налога не добавляется повторно; окончательная цена после скидки не уменьшается ещё раз на ту же скидку. Если документ не позволяет определить включение налога или распределение скидки, требуется ручная проверка, а не догадка по товару. Цена базовой единицы вычисляется из проверенной фасовки и приобретённого количества; суммы оригинала и расчётная проверка показываются рядом. Внутренние пределы точности/правило округления утверждаются в контракте без потери итоговой суммы первички. Доставка остаётся стоимостной строкой и не создаёт материал на складе. [B:211–221; U:цена за единицу]", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 411, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "KPI-01", "text": "KPI-01. Основная формула: Доля закупок за период = сумма принятых закупочных обязательств по счетам, отнесённых к этому периоду и включённых в KPI / стоимость фактически оказанных услуг со скидкой за тот же период и контур × 100%.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 417, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "KPI-02", "text": "KPI-02. Проектное уточнение. В качестве подтверждённого обязательства используется проверенный и принятый закупщиком счёт. Подготовленный заказ без счёта показывается как предварительный план отдельно. После появления счёта план заменяется подтверждённой суммой, а не прибавляется к ней. Неоплаченный принятый счёт включается; оплата и приёмка не добавляют его повторно.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 420, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "KPI-03", "text": "KPI-03. Хранить отдельно дату заказа, дату счёта и период отнесения закупки. При наличии заказа период по умолчанию — месяц заказа; при отсутствии — месяц счёта. Поздний счёт за прежний заказ относится к подтверждённому исходному периоду. Это проектное правило для неоднозначного случая; оно не выдается за уже утверждённую бухгалтерскую методику. Изменение периода документируется.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 422, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "KPI-04", "text": "KPI-04. Включаются соответствующие медицинские материалы, инструменты, доставка и отнесённое к текущим затратам оборудование. Инвестиционные приобретения и ремонт исключаются из KPI сотрудницы, но не исчезают из общего реестра документов. Классификация «в KPI / инвестиционное / вне KPI» задаётся явно по документу или строке; не выводится автоматически из слова «оборудование» или цены. Массовая закупка имплантов имеет отдельное согласование. [F:67–71]", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 424, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "KPI-05", "text": "KPI-05. Общие расходы остаются собственной группой. Выдача перчаток на 5 000 ₽ кабинету создаёт аналитику выдачи этого кабинета, но не переносит закупочный счёт из «Общих» в «Терапию» и не начисляет вторые 5 000 ₽ расходов. Группа закупки и получатель выдачи — разные разрезы. [F:71–85]", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 426, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "KPI-06", "text": "KPI-06. Лимит — версия настройки по юрлицу/периоду с автором, датой принятия и историей. Значение 20% записывать только после подтверждения уполномоченным пользователем для указанного месяца, не как общий постоянный лимит. Этот модуль не рассчитывает автоматически удержания или зарплатные санкции. [F:87–93]", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 428, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "KPI-07", "text": "KPI-07. При нулевой выручке процент не вычисляется; при недоступной/неполной выручке показывается её состояние и время синхронизации. Нельзя использовать выручку всех организаций для закупок одной. Если iDent даёт только клинику, сопоставление юридическому лицу проверяется до включения консолидированного KPI.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 430, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "KPI-08", "text": "KPI-08. Отмена/уменьшение подтверждённого обязательства учитываются один раз через связанную корректировку, а не удалением исходного документа. Последующий возврат денег изменяет денежный расчёт с поставщиком и не уменьшает повторно уже скорректированный KPI (PAY-06). Предлагаемый режим закрытого месяца: сохранять снимок исходного отчёта и выпускать явную пересчитанную версию с дельтой и причиной. Изменение исторического KPI не происходит бесследно. Финансовый ответственный утверждает политику закрытия до внедрения.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 432, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "REP-01", "text": "REP-01. Отдельно: принято по счетам в бюджет; оплачено; принято материалов; центральный запас; резервы и ожидающие выдачи; выдано в работу; подтверждённо использовано по iDent; дополнительные расходы; закреплённые инструменты; возвраты и межклинические передачи.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 436, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "REP-02", "text": "REP-02. Стоимость центрального запаса включает его известные размещения у закупщика, на витрине и в хирургии, пока это запас той же зоны; не включает обычные расходники, уже выданные в работу. Стоимость запаса / оказанные услуги со скидкой показывается отдельно от доли закупок и подписывается как показатель запаса, не расхода. [F:73–85; C:263–287]", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 438, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "REP-03", "text": "REP-03. Разрезы: период, юрлицо, клиника, закупочная группа, материал, поставщик, кабинет/врач-получатель, тип операции. Движение за месяц: начало + приход − расход ± корректировки = конец. Не суммировать строку группы с её раскрытыми дочерними строками.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 440, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "REP-04", "text": "REP-04. Доступны история цены, изменения по поставщику, отложенные потребности, сроки поставок, задержки подтверждения, доля закупки крупным запасом и неполнота данных. Прогноз повторной закупки строится по выдачам как ориентир, не как измеренный клинический расход. Автоматической покупки или нормативного списания по нему нет.", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 442, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "REP-05", "text": "REP-05. Получатель затрат, оператор и место (v1.1). В истории отдельны: кто оформил/забрал, кому выдано в работу, где физически находилось и к какой закупочной группе относится документ. Материал для врача относится в отчёт этого врача и его выбранного на момент операции направления, не автоматически к сегодняшнему кабинету. Общая закупочная группа остаётся «Общие» и при выдаче в терапевтический кабинет. Сводки «по врачу», «по кабинету» и «по группе» — разрезы, а не независимые расходы для сложения. Переезд врача или смена профиля кабинета не переписывают прошлую атрибуцию. [C:279–289; F:71–85]", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 444, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "REP-06", "text": "REP-06. Срезы стоимости и времени (v1.1). На показателях видны момент среза запаса, период закупок и период оказанных услуг, а также свежесть источника. Для текущего месяца показывается месяц по текущую дату, не полный будущий месяц. Для исторического отчёта запас берётся на согласованный конец выбранного периода, а не всегда сегодняшний. Если исторический срез/стоимость недоступны, это прямо указывается. Стоимость запаса / оказанные услуги за тот же выбранный отчётный период — показатель запасов к обороту, не измеренная доля расхода и не оборот в днях. Карантин и ожидающие вторую подпись выделяются, чтобы финансовый запас не выдавался за свободный физический. [C:267–277; F:73–85. Точное синхронное время срезов — проектная детализация.]", "section": "14. Цены, стоимость запаса и бюджетный KPI", "sourceLine": 446, "scope": "Интерфейс и локальная модель", "route": "reports", "tab": "", "path": "Отчёты"}, {"id": "UI-W01", "text": "UI-W01. «Обзор». Выбор разрешённой организации/юрлица, период, бюджет закупок и процент, центральный запас, очередь неподтверждённых выдач, срочные заявки, поставки и исключения. Главные цифры ведут к объясняющим документам. Вверху не смешивать шесть одинаковых декоративных карточек без рабочего приоритета.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 452, "scope": "Интерфейс и локальная модель", "route": "overview", "tab": "", "path": "Обзор"}, {"id": "UI-W02", "text": "UI-W02. «Заявки и закупка». Сводная таблица направлений и материалов с раскрытием кабинетов/врачей. Редактирование количества прямо в строке, перенос остатка без обязательного длинного объяснения, сравнение предложения и истории цены, подготовка отдельных заказов.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 454, "scope": "Интерфейс и локальная модель", "route": "procurement", "tab": "summary", "path": "Закупка → summary"}, {"id": "UI-W03", "text": "UI-W03. «Заказы и счета». Связанные заявки, поставщик, направление, сумма, состояние подтверждения/оплаты/поступления, файлы, недопоставка, возвраты. Отдельные суммы, а не один флаг «куплено».", "section": "15. Экраны и требования к будущему макету", "sourceLine": 456, "scope": "Интерфейс и локальная модель", "route": "orders", "tab": "", "path": "Заказы и счета"}, {"id": "UI-W04", "text": "UI-W04. «Поступления». Документ слева или по переключению, распознанные строки и проверка справа; фактические количества; неуверенные поля; проверка дубля; итог перед проведением. На телефоне — съёмка/добавление страниц и последовательная проверка без широкой настольной таблицы.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 458, "scope": "Интерфейс и локальная модель", "route": "receipts", "tab": "", "path": "Поступления"}, {"id": "UI-W05", "text": "UI-W05. «Запас и каталог». Поиск, доступное количество, резервы, режим, единицы, карточка материала с размещениями/историей/ценами/поставщиками. Быстрый ответ «где числится эта позиция» сразу по всем разрешённым кабинетам и врачам.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 460, "scope": "Интерфейс и локальная модель", "route": "stock", "tab": "", "path": "Запас и каталог"}, {"id": "UI-W06", "text": "UI-W06. «Выдачи и движения». Очередь целых документов, изменение и повторное подтверждение, история, массовые операции, межклинические передачи. Типы расхода и размещения различимы словами, а не только цветом.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 462, "scope": "Интерфейс и локальная модель", "route": "movements", "tab": "", "path": "Движения"}, {"id": "UI-W07", "text": "UI-W07. «Инвентаризация и отчёты». Срез, подсчёт, расхождения, сверка iDent/дополнительных расходов, экспорт и утверждение периода. Настройки групп, прав, режима карточек, цикла и лимитов находятся отдельно от ежедневных действий.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 464, "scope": "Интерфейс и локальная модель", "route": "reconcile", "tab": "inventory", "path": "Сверка → Инвентаризация"}, {"id": "UI-W08", "text": "UI-W08. Матрица распределения (v1.1). Помимо раскрытия отдельной строки требуется режим сводки «материал × кабинет/врач»: материалы по строкам, выбранные получатели по столбцам, количества в пересечениях и общий итог направления. Поиск/фильтр ограничивает число получателей; итог учитывает и не показанные из-за горизонтальной прокрутки столбцы, что явно подписано. Из ячейки открывается исходная заявка. На телефоне используется последовательное раскрытие, а не обязательная широкая матрица. Общая сводка и детальный заказ доступны из одного рабочего контекста. Точный визуал согласуется на макете. [U:исходное ТЗ сотрудницы, п.2]", "section": "15. Экраны и требования к будущему макету", "sourceLine": 466, "scope": "Интерфейс и локальная модель", "route": "procurement", "tab": "matrix", "path": "Закупка → Матрица"}, {"id": "UI-W09", "text": "UI-W09. «Сверка счёта и поставок» (v1.2). Из счёта открыть связанную таблицу: спецификация/фасовка → по счёту → каждая накладная с датой → всего по документам → принято фактически → осталось/расхождение. Повторяющиеся исходные строки свёрнуты только визуально, доступны по раскрытию. Выбор ячейки открывает именно её страницу и фрагмент скана. Над таблицей — состав пакета (документы и страницы), комплектность, состояние сопоставления, предупреждения о цене/рукописных исправлениях. Подтверждение предложенных связей и приёмки доступно пакетно для проверенных строк без обязательных ручных действий на каждую строку; спорные места выделены отдельно. На телефоне — список документов и последовательное раскрытие товара, не широкая таблица всех поставок. Нельзя получить зелёное «всё поставлено» только по общей сумме. Данные этого разбора служат сценариями будущего макета, но макет здесь не создан.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 468, "scope": "Интерфейс и локальная модель", "route": "orders", "tab": "reconciliation", "path": "Заказы и счета → Сверка счёта и поставок"}, {"id": "UI-M01", "text": "UI-M01. Для ассистента: доступные получатели, свои/разрешённые заявки кабинета, ожидаемое по прошлым неделям, новое дополнительное количество, срочное обращение, готовое к получению, история выдач и отслеживаемые закреплённые позиции. Цен и чужих кабинетов нет.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 472, "scope": "Интерфейс и локальная модель", "route": "requests", "tab": "", "path": "Заявки"}, {"id": "UI-M02", "text": "UI-M02. Создать выдачу из заявки или фактически взятых материалов, подтвердить весь документ, увидеть ожидание второй подписи и исправленный список. Можно получать по разрешённой заявке коллеги; история показывает фактического получателя, не подменяет его автором заявки.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 474, "scope": "Интерфейс и локальная модель", "route": "requests", "tab": "", "path": "Заявки"}, {"id": "UI-M03", "text": "UI-M03. Для закупщика на мобильном дополнительно: входящие подтверждения, срочные запросы, съёмка накладной, приёмка и очередь исключений. Управление большой сводкой остаётся удобным на компьютере, а не требует выполнять всё на телефоне.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 476, "scope": "Интерфейс и локальная модель", "route": "requests", "tab": "", "path": "Заявки"}, {"id": "UI-M04", "text": "UI-M04. Проектное решение. «Материалы» — отдельный доступный раздел приложения. Конкретное место в нижней навигации или ролевом хабе согласуется на макете без удаления существующих нужных разделов. Поддержать iOS и Android; экран не заменяется просто ссылкой на широкую веб-таблицу.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 478, "scope": "Интерфейс и локальная модель", "route": "requests", "tab": "", "path": "Заявки"}, {"id": "UI-M05", "text": "UI-M05. Ожидаемые поставки (v1.1). Автор видит по связанным строкам, что подтверждено, что оплачено, что ещё не куплено, ожидаемую дату при её наличии и последнюю подтверждённую задержку. «Оплачено» не заменяет «дата поставки подтверждена». Неизвестная дата не подменяется прогнозом «скоро». Полученное для полного комплекта может оставаться не готовым к выдаче; причина видна. Изменение статуса не заставляет создавать новую заявку. [U:мобильный сценарий ближайших поставок; B:125–131; C:257–261]", "section": "15. Экраны и требования к будущему макету", "sourceLine": 480, "scope": "Интерфейс и локальная модель", "route": "requests", "tab": "", "path": "Заявки"}, {"id": "UI-Q01", "text": "UI-Q01. До реализации — согласованный интерактивный макет по `frontend-designer`, просмотр реальных рендеров на телефоне, планшете и компьютере; loading/empty/error/no-access/partial-data/overdue состояния включены. Не отдавать фиктивный статус «дизайнер одобрил» по одному чтению файла инструкций.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 486, "scope": "Интерфейс и локальная модель", "route": "overview", "tab": "", "path": "Обзор"}, {"id": "UI-Q02", "text": "UI-Q02. Основные действия доступны клавиатурой; подписи полей явные; кнопки мобильного интерфейса не меньше принятого в проекте touch-target; статусы имеют текст; расчёты доступны не только графиками. Поиск и массовые действия не требуют открывать сотни карточек. Ассистент не обязан объяснять закупщику каждую обычную перенесённую позицию.", "section": "15. Экраны и требования к будущему макету", "sourceLine": 488, "scope": "Интерфейс и локальная модель", "route": "overview", "tab": "", "path": "Обзор"}, {"id": "NTF-01", "text": "NTF-01. Немедленно уведомлять закупщика о срочном обращении; готовность к получению/задержка — разрешённых участников соответствующей заявки. Получателей определять по текущим правам, авторству, ответственному кабинета и участию; не рассылать всей клинике. [F:173–175; C:257–261]", "section": "16. Уведомления и отсутствие связи", "sourceLine": 492, "scope": "Интерфейс и локальная модель", "route": "settings", "tab": "lab", "path": "Настройки → Состояния макета"}, {"id": "NTF-02", "text": "NTF-02. При получении другим ассистентом состояние заявки обновляется у всех разрешённых участников, чтобы автор не пришёл за уже выданным. Уведомление не заменяет актуальное состояние приложения.", "section": "16. Уведомления и отсутствие связи", "sourceLine": 494, "scope": "Интерфейс и локальная модель", "route": "settings", "tab": "lab", "path": "Настройки → Состояния макета"}, {"id": "NTF-03", "text": "NTF-03. Неподтверждённые выдачи имеют очередь и напоминания по рабочему календарю. Повторное событие импорта не порождает повторные уведомления. Не отправлять закупочные цены сотрудникам без финансового права, сведения о пациенте — в обычные push.", "section": "16. Уведомления и отсутствие связи", "sourceLine": 496, "scope": "Интерфейс и локальная модель", "route": "settings", "tab": "lab", "path": "Настройки → Состояния макета"}, {"id": "NTF-04", "text": "NTF-04. Новая позиция и подтверждённые сроки (v1.1). Предложение нового материала создаёт задачу/запись согласования в очереди закупщика и соответствующее уведомление, без отправки поставщику. Задержку и изменённую ожидаемую дату закупщик фиксирует по полученной информации; уведомляются актуальные разрешённые участники, а не весь персонал. Система различает срочную потребность, поступление, готовность комплекта, частичное обеспечение и срочную оплату счёта. Предлагаемая защита от шума: повтор той же версии события не создаёт новую рассылку. [C:257–261; F:175]", "section": "16. Уведомления и отсутствие связи", "sourceLine": 498, "scope": "Интерфейс и локальная модель", "route": "settings", "tab": "lab", "path": "Настройки → Состояния макета"}, {"id": "NET-01", "text": "NET-01. Проектное решение. v1 рассчитан на онлайн-проведение. При пропадании связи можно сохранить локальный черновик без обещания резерва. До ответа сервера не показывать «проведено». Повтор отправки использует тот же ключ операции; после восстановления проверяет её состояние, а не создаёт новый документ. На общем устройстве локальные данные отделены по профилям; собственные телефоны не отменяют проверку доступа.", "section": "16. Уведомления и отсутствие связи", "sourceLine": 500, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "lab", "path": "Настройки → Состояния макета"}, {"id": "TECH-01", "text": "TECH-01. Проведённые операции неизменяемы; исправления — компенсирующие/корректирующие документы со ссылкой. На экране можно дать простое «Исправить», но в журнале остаются обе версии и последствия.", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 521, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "TECH-02", "text": "TECH-02. Доступность, резерв и проведение проверяются атомарно. Две одновременные выдачи не могут зарезервировать один запас дважды. Версии документов защищены от потери правок. Подписи проверяются относительно одного revision и двух разных пользователей.", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 523, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "TECH-03", "text": "TECH-03. Ключ идемпотентности ограничен организацией, действием и логическим документом. Тот же ключ с другим телом даёт конфликт, а не повтор. После таймаута клиент читает статус. Обработка входного события и запись его проведения атомарны; уведомление доставляется через надёжный outbox.", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 525, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "TECH-04", "text": "TECH-04. Остаток — проекция журнала, а не редактируемая независимая цифра. Суммовые и количественные проекции можно пересчитать и сверить. Каждый переход типа материала, единицы или границы учёта проверяется на существующие остатки, резервы и документы.", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 527, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "TECH-05", "text": "TECH-05. Резерв из закупочной заявки и резерв фактической выдачи имеют явную связь. Передача между ними не вычитает одно количество дважды. Увеличение, уменьшение и отмена учитывают, был ли материал уже физически передан.", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 529, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "TECH-06", "text": "TECH-06. Каждая таблица/запись имеет нужный tenant-контекст, индексы внешних ключей и политику изоляции. Новые таблицы включают защиту уровня строк в принятом проектом виде; прямой обход через file ID, export, background job и lookup тестируется. Межорганизационная передача использует узкий разрешённый контракт двух сторон, не общий запрос без ограничений.", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 531, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "TECH-07", "text": "TECH-07. Аудит отделён от обязательного ручного комментария. В автоматическом аудите: кто, когда, какое действие, документ/revision, старое и новое значение, основание права. Обычное уменьшение заявки не заставляет писать объяснение; списание утраты или исправление проведённого учёта всё равно имеет тип причины.", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 533, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "TECH-08", "text": "TECH-08. Имя врача/кабинета на момент операции не перетирается последующим переименованием или перепрофилированием. Активная связь сохраняет поиск по текущему объекту; исторические отчёты не переписываются новой ролью/направлением автоматически.", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 535, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "TECH-09", "text": "TECH-09. Проектный контракт источников. Дополнить модель сущностями ScanBundle/SourceDocument/SourcePage/SourceLine и InvoiceDeliveryAllocation (названия проектные). У исходной строки: стабильный source ID, исходный файл/хеш, страница/фрагмент, номер строки, код и текст товара, сырые и нормализованные значения, версия распознавания, уверенность и подтверждение человеком. У связи: строки с обеих сторон, количество/единица/стоимостная база, автор и ревизия. Один документ может иметь несколько сканов; они не создают самостоятельных складских эффектов. Подтверждение связи не является ни оплатой, ни приходом. Повторное распознавание сохраняет ранее проведённую версию и предлагает изменения для сверки, не перепроводит документ. Удаление страницы из текущего представления не удаляет исходный файл и доказательство проведённой операции. Файлы, стороны, платежи и потребности не связываются сквозь закрытые организационные границы. Реальные сканы с реквизитами/подписями не коммитить в репозиторий и не публиковать в демонстрациях: для тестов извлекать минимальные разрешённые поля либо использовать обезличенные производные. [D1–D5; TECH-01–07]", "section": "17. Техническая модель и обязательные инварианты", "sourceLine": 547, "scope": "Вне HTML: проверка реализации", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "CHECK-01", "text": "CHECK-01. iDent. Семантика реального материального события; таблицы и устойчивые ID; фильтры удалений/отмен/исправлений; единицы; определение гарантийных случаев; задержки; источник итогов оказанных услуг со скидкой; сопоставление клиники/юрлица. Нужны безопасные диагностические срезы и сопоставление с первичными документами, не догадки по скриншоту.", "section": "18. Что проверить в инфраструктуре перед реализацией", "sourceLine": 551, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "CHECK-02", "text": "CHECK-02. Начальные данные и полученные образцы (обновлено v1.2). Пять PDF D1–D5, включая счёт по борам и три УПД, получены и просмотрены по всем 11 страницам. Условие «предоставить первые образцы» выполнено; состояние «образцов нет» больше не актуально. Это не полный архив закупок, не начальная инвентаризация и не доказательство оплаты/закрытия заказа. Доступность актуального каталога, количественных остатков, истории цен и документов на дату перехода проверяется отдельно. Начальные значения и импорт прошлых событий не должны расходовать запас дважды. Документарная разница D4/D5 описана в §22.6 и остаётся невыясненной в пределах присланного комплекта. [F:187 как ранее данное обещание; D1–D5 как полученные образцы]", "section": "18. Что проверить в инфраструктуре перед реализацией", "sourceLine": 553, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "CHECK-03", "text": "CHECK-03. Платформа. Актуальные модели организаций/кабинетов/смен, доступ к файлам, notification routing, API для мобильных ролей, финансовые единицы, audit/RLS и текущая навигация. Подключение одной роли на вебе не означает готовый доступ на iOS/Android.", "section": "18. Что проверить в инфраструктуре перед реализацией", "sourceLine": 555, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "CHECK-04", "text": "CHECK-04. Дизайн. Перед макетом завершить авторизованную визуальную сверку реального production-кабинета безопасным способом, без публикации данных пациентов. Проверенный CSS из main не доказывает, что он уже развёрнут на production. На данном этапе макет не создан и не согласован.", "section": "18. Что проверить в инфраструктуре перед реализацией", "sourceLine": 557, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "CHECK-05", "text": "CHECK-05. Документы. Провайдер распознавания, разрешённое хранение и обработка документов, ограничения страниц/размера, обработка ошибок, доступ к исходникам и удаление/сроки хранения. Не загружать первичные документы в сторонний сервис без принятой политики.", "section": "18. Что проверить в инфраструктуре перед реализацией", "sourceLine": 559, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "CHECK-06", "text": "CHECK-06. Доставка кода. Прочитать актуальные правила проекта и Bridge перед запуском реализации; переиспользовать существующую задачу/ветку, если они есть. Файл с инструкцией агента — не реально выполненное независимое ревью. Изолированные worktrees, актуальный head, проверки, согласованный UI и production-proof обязательны для объявления готовности. Этот документ не запускает BB coding provider и не меняет инфраструктуру.", "section": "18. Что проверить в инфраструктуре перед реализацией", "sourceLine": 561, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "CHECK-07", "text": "CHECK-07. Передача первички и права назначения (v1.1). Уточнить у финансового ответственного формат комплекта счёт/накладные, действующий путь на Google Диск и полномочия на подтверждение передачи; не требовать заново описать процесс у закупщика. Установить список разрешённых врачей/кабинетов и поручения, включая будущие кабинеты. Отсутствие внешнего коннектора не означает, что первичка потеряна: доступен контролируемый экспорт. До интеграции с внешним сервисом подтвердить доступ, безопасность и необходимый write-контракт.", "section": "18. Что проверить в инфраструктуре перед реализацией", "sourceLine": 563, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "CHECK-08", "text": "CHECK-08. Контрольный пакет распознавания (v1.2). На D1–D5 проверить группировку документов/страниц, извлечение повторных строк, фасовку, печатную/итоговую цену, рукописные пометки, направление возврата и связь накладных. Сравнить результат с вручную проверенной разметкой и сохранить необработанные исключения. В этой итерации OCR-конвейер не запускался и его точность не измерена: документы прочитаны визуально, арифметика перепроверена отдельно. В корпусе всего семь логических документов, поэтому нельзя заявлять универсальную точность или готовность ко всем формам поставщиков. Расширение набора примеров при техническом испытании не означает новый большой опрос сотрудницы. Не устанавливать связь со счётом только по платёжному номеру или близкой сумме.", "section": "18. Что проверить в инфраструктуре перед реализацией", "sourceLine": 565, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "MIG-01", "text": "MIG-01. До переноса: назначить ответственных, подтвердить границы самостоятельных учётов, шесть закупочных групп, режимы материалов, единицы, сопоставления с iDent и доступ сотрудников. Сначала очистка неоднозначностей, а не массовое объединение названий.", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 662, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "MIG-02", "text": "MIG-02. Начальный остаток — подтверждённая инвентаризация на конкретную дату/время. Дата из прежнего обсуждения не является обещанием запуска. Отдельно перенести открытые заявки, заказы в пути, проверенные счета, оплаты и ожидаемые возвраты; уже оплаченный, но не полученный товар не попадает в начальный запас.", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 664, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "MIG-03", "text": "MIG-03. Исторические документы цен загружаются со статусом источника. Счёт без доказательства поставки может подтверждать предложение/обязательство, но не автоматически количество поступившего. Стартовая стоимость может быть неполной; степень покрытия показывается до и после восстановления.", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 666, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "MIG-04", "text": "MIG-04. Интеграция сначала работает на безопасной сверке: сравниваются уникальные расходы и контрольные суммы с iDent без двойного реального проведения. Затем утверждается точка переключения. Повтор старой истории не изменяет новый стартовый остаток.", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 668, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "MIG-05", "text": "MIG-05. Для отказа от полного ручного склада iDent нужен ответ руководителя, который использует его для контроля. Без него не объявлять переход завершённым и не заставлять закупщика незаметно вести две системы. При необходимости временного параллельного контроля явно определить период и источник истины. [F:27–37]", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 670, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "MIG-06", "text": "MIG-06. Исторические движения и исправление старого состояния (v1.1). Сохранить требование месячного разреза «на начало / приход / расход / на конец» и истории размещений/цен. При обследовании определить, какие прошлые периоды реально доступны и с какой полнотой; не обещать полный архив из одного Excel названий. Старую историю можно импортировать в справочно-аналитическом режиме с датой, источником и признаком неполноты, без повторного проведения поверх стартовой инвентаризации. Массовая очистка наследованных неверных остатков выполняется проверенной корректировкой стартового состояния, не произвольным расходом нового месяца. Длина доступной истории и ограничения источника фиксируются до переключения. [C:191–199; U:п.5; INT-07]", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 672, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "REL-01", "text": "REL-01. Порядок: согласование этого ТЗ и продуктовых предложений → проверка интеграционных контрактов и первичных документов → интерактивный макет веба/мобильных сценариев → согласование макета → реализация в изолированных ветках → тесты и ревью → подтверждённый CI/merge → API до зависящих мобильных клиентов → проверка production → закрытие задачи с доказательствами. Чтение исходников или один зелёный тест не являются приёмкой модуля.", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 674, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "REL-02", "text": "REL-02. All-15 означает доступность и сценарии всех 15 кабинетов к согласованному запуску; техническая проверка на синтетических примерах или одной пробной смене не сокращает этот объём. За приёмку рабочих сценариев отвечают закупщик и ассистенты, за бюджет и переход — руководство/финансовый ответственный.", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 676, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "MET-01", "text": "MET-01. Проектные метрики приёмки. Недельное время обработки, повторно введённые строки, очередь выдач старше рабочего дня, дубли потребностей, неразнесённый расход iDent, время одной приёмки, доля ручных исправлений распознавания, полнота стоимости, расхождения инвентаризации. Не обещать процент точности OCR до проверки на реальных документах.", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 678, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "MET-02", "text": "MET-02. Предлагаемые технические цели. Обычное чтение/сохранение — p95 до 2 секунд без учёта внешней сети; резерв/подпись с немедленным индикатором обработки; длительное распознавание асинхронное с прогрессом; нагрузочный профиль — не меньше согласованного справочника около 1 000 активных позиций, всех кабинетов и параллельных выдач. Конкретные пределы числа документов/пользователей закрепить после измерения инфраструктуры, не выдавать их за уже доказанную производительность.", "section": "20. Переход, выпуск и измерение результата", "sourceLine": 680, "scope": "Вне HTML: проверка реализации", "route": "reconcile", "tab": "quality", "path": "Сверка → Качество данных"}, {"id": "G-01", "text": "Единственный источник достоверных складских остатков после запуска. · Signalo; iDent — источник клинического расхода и продаж. Отказ от полного ручного склада iDent должен подтвердить руководитель. Сотрудница оставила это решение открытым.", "section": "21. Лист согласования: без нового опроса сотрудницы", "sourceLine": 688, "scope": "Открытое решение", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "G-02", "text": "Метод оценки запаса и политика исправления периода. · Скользящая средневзвешенная для массовых позиций, индивидуальная стоимость для экземпляров; отдельные корректировки и версии закрытых отчётов. Это проектные правила, не ответы сотрудницы.", "section": "21. Лист согласования: без нового опроса сотрудницы", "sourceLine": 689, "scope": "Открытое решение", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "G-03", "text": "Период отнесения и момент включения суммы в KPI. · Проверенный принятый счёт, период связанного заказа; заказ без счёта — отдельный план. Настроить лимит и классификацию инвестиций без автоматических зарплатных последствий.", "section": "21. Лист согласования: без нового опроса сотрудницы", "sourceLine": 690, "scope": "Открытое решение", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "G-04", "text": "Передачи между разными юрлицами. · Согласовать основание, стоимость/момент смены владельца и бюджетную классификацию; не объявлять обычную внутрикабинетную операцию достаточной. Функция требуется в v1.", "section": "21. Лист согласования: без нового опроса сотрудницы", "sourceLine": 691, "scope": "Открытое решение", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "P-01", "text": "P-01. Ввод дополнительной потребности отдельно от переносимого остатка, без сравнения «большой/малой разницы» и без обязательных длинных пояснений.", "section": "21. Лист согласования: без нового опроса сотрудницы", "sourceLine": 695, "scope": "Вариант для согласования", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}, {"id": "P-02", "text": "P-02. Вторник 09:00 — предлагаемое начальное значение открытия цикла; в источнике сказано только «во вторник утром». Рабочие сроки и напоминания настраиваются по клинике.", "section": "21. Лист с без нового опроса сотрудницы", "sourceLine": 705, "scope": "Вариант для согласования", "route": "settings", "tab": "decisions", "path": "Настройки → Решения"}];

function fbFinanceHelp(id=''){openModal('Счёт, оплата и закрывающие документы','Разные действия и разные ответственные',`<div class="fb-explainer"><h3>Вы загружаете счёт в Signalo</h3><p>Закупщик прикрепляет PDF или фотографию, проверяет поставщика, направление, количество, цену и сумму. Подтверждает: «Счёт проверен — принять в закупку».</p><h3>Передаёте финансовому менеджеру</h3><p>В рабочем сценарии счёт появляется во внутренней очереди финансового менеджера выбранной клиники. Это электронная отметка «отдала в оплату», не перевод денег. Отправка в банк, 1С, мессенджер или Google Диск не выполняется этой кнопкой.</p><h3>Финансовый менеджер отмечает платёж</h3><p>Только после факта оплаты он вводит сумму и дату. Поэтому статус может быть «не оплачен», «частично оплачен» или «оплачен». У закупщика остаётся отдельный факт передачи на оплату.</p><h3>Счёт и все накладные — один комплект</h3><p>Комплект содержит счёт и доступные УПД/накладные, в том числе допоставки, а при наличии — связанные документы корректировок. Недостающие документы показаны явно. «Скачать» сохраняет файлы на ваш компьютер.</p><h3>«Зафиксировать передачу» — не «отменить»</h3><p>Эта команда записывает, какие документы, кому, когда и каким способом вы уже передали. При ручной передаче через Google Диск загрузку выполняете вы. Автоматическая интеграция с внешними сервисами не согласована.</p></div>`+notice('В этом HTML всё — локальный учебный процесс. Смена роли позволяет посмотреть внутреннюю очередь. Реальные деньги и документы никому не отправляются.','info'),(id?btn('Вернуться к счёту','orderDetail',id):btn('Закрыть','closeModal')),{wide:true});}
ACTIONS.sendFinance=id=>{const i=fbInvoice(id);if(!i||!canBuy())return;if(!i.accepted)return errorForm('Сначала закупщик проверяет и принимает счёт.');if(i.financeHandoff)return toast('Этот счёт уже передан. Повторная задача не создана.');openModal('Передать счёт финансовому менеджеру',id+' · '+ENT[i.entity].legal,`<dl class="kv"><div><dt>Кому</dt><dd>Финансовый менеджер выбранной клиники</dd></div><div><dt>Где появится</dt><dd>Signalo → Заказы и счета → К оплате</dd></div><div><dt>Сумма</dt><dd>${rub(i.amount-i.adjustment)}</dd></div><div><dt>Срочность оплаты</dt><dd>${i.urgent?'Срочно':'Обычная'}</dd></div></dl><div class="mt16">${notice('Будет зафиксировано «передан на оплату». Статус «оплачен» не появится, деньги не отправятся. В HTML передача видна только при переключении учебной роли.','info')}</div>`,btn('Отмена','orderDetail',id)+btn('Передать в очередь оплаты','fbCommitFinance',id,'primary','check'),{wide:true});};

// ZIP (stored entries) is generated locally without libraries or network requests.
function fbZip(files){const enc=new TextEncoder(),out=[],central=[];let offset=0;const crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=(n&1)?0xedb88320^(n>>>1):n>>>1;return n>>>0;});const crc=b=>{let c=0xffffffff;for(const x of b)c=crcTable[(c^x)&255]^(c>>>8);return (c^0xffffffff)>>>0;};
 for(const f of files){const name=enc.encode(f.name),data=enc.encode(f.text),sum=crc(data),h=new Uint8Array(30+name.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,sum,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);h.set(name,30);out.push(h,data);const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint32(16,sum,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);ch.set(name,46);central.push(ch);offset+=h.length+data.length;}
 const size=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);return new Blob([...out,...central,end],{type:'application/zip'});}

function v12Units(s){ // units in number cells are text, digits stay mono (#30)

const v12TableBase=table;
let V12_LEGACY_EMPTY=false;
table=function(heads,rows,opts={}){
  if(!rows.length)return (V12_LEGACY_EMPTY?'<div class="panel"></div>':'')+v12Empty(opts.empty);
  rows=rows.map(r=>{ // #14: a row that has its own «Открыть ›» button is not clickable twice
    const cells=[...r],t=cells.findIndex(c=>typeof c==='object'&&c&&c.class==='title');
    if(t<0)return cells;
    const m=/<button class="linkbtn" data-action="([^"]+)" data-arg="([^"]*)">([\s\S]*?)<\/button>/.exec(cells[t].html);
    if(!m)return cells;
    const last=cells[cells.length-1],lastHtml=String(typeof last==='object'&&last?last.html:last);
    const dup=cells.length-1!==t&&lastHtml.includes('class="btn');
    if(dup)cells[t]={...cells[t],html:cells[t].html.replace(m[0],`<strong class="rowtitle">${m[3]}</strong>`)};
    return cells;
  });
  let html=v12TableBase(heads,rows,opts);
  if(opts.mcompact)html=html.replace('<table class="data ','<table class="data mcompact ');

};
